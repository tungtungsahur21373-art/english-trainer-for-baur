w small{color:var(--muted)}.mini{border:1px solid #315174;background:#1a3452;color:#dcecff;border-radius:10px;padding:8px 10px}.mini.delete{color:#ffb7c1}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:16px;border-radius:16px;background:#122945;border:1px solid #294361}.stat strong{display:block;font-size:28px;color:var(--mint);margin-bottom:5px}.stat span{font-size:13px;color:var(--muted)}.history{padding:12px 0;border-bottom:1px solid #233b59;display:flex;justify-content:space-between;gap:10px}.empty{color:var(--muted);padding:20px;text-align:center}.hidden{display:none!important}.tiny{font-size:12px;color:#8ea6c8}
@media(min-width:430px){.menu-card{padding:23px 20px}.menu-card strong{font-size:23px}.menu-card .ico{flex-basis:70px;height:70px}}

<script>
const START_WORDS = [

["What","что / какой"],["Who","кто"],["Where","где / куда"],["Why","почему"],["How","как"],["Which","который / какой"],["Here","здесь"],["There","там"],["This","это / этот"],["That","то / тот"],

["I get up early","я рано встаю"],["I go to work","я иду на работу"],["I am at work","я на работе"],["I finish work at six","я заканчиваю работу в шесть"],["I need a break","мне нужен перерыв"],["I am tired today","я сегодня устал"],["I am busy now","я сейчас занят"],["I am ready to start","я готов начинать"],["I want to learn English","я хочу учить английский"],["I want to speak English","я хочу говорить по-английски"],["I speak a little English","я немного говорю по-английски"],["Please speak slowly","пожалуйста, говорите медленно"],["Can you repeat that?","можете повторить?"],["Could you help me?","не могли бы вы мне помочь?"],["I don't understand this","я этого не понимаю"],["I understand now","теперь я понимаю"],["What does it mean?","что это означает?"],["How do you say this in English?","как сказать это по-английски?"],["How much does it cost?","сколько это стоит?"],["Where is the bus stop?","где автобусная остановка?"],["Where do you live?","где ты живёшь?"],["Where are you from?","откуда ты?"],["I am from Kazakhstan","я из Казахстана"],["My name is Baur","меня зовут Баур"],["Nice to meet you","приятно познакомиться"],["Have a nice day","хорошего дня"],["See you tomorrow","увидимся завтра"],["I need some water","мне нужна вода"],["I would like some tea","я бы хотел чаю"],["I am hungry","я голоден"],["I am thirsty","я хочу пить"],["I don't have time","у меня нет времени"],["I have a question","у меня есть вопрос"],["I need more practice","мне нужно больше практики"],["I made a mistake","я совершил ошибку"],["Don't worry","не волнуйся"],["Wait a moment, please","подождите минутку, пожалуйста"],["I will be back soon","я скоро вернусь"],["Let's start now","давай начнём сейчас"],["What time is it?","который час?"],["Today is Monday","сегодня понедельник"],["I work every day","я работаю каждый день"],["I work with a team","я работаю в команде"],["I check my work","я проверяю свою работу"],["Safety is important","безопасность важна"],["Be careful","будь осторожен"],["I need my tools","мне нужны мои инструменты"],["The machine is ready","машина готова"],["Start the machine","запусти машину"],["Stop the machine","останови машину"],["The work is finished","работа закончена"],["I am learning new words","я учу новые слова"],["I study every day","я занимаюсь каждый день"],["I want to work abroad","я хочу работать за границей"]

const $=s=>document.querySelector(s);
const main=$("#main");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let words, stats, usedQuestions, currentQuiz=null, editingId=null;
function load(){
 try{words=JSON.parse(localStorage.getItem("et_words"))||[];}catch{words=[]}
 const known=new Set(words.map(w=>(String(w.en||"").trim().toLowerCase()+"|"+String(w.ru||"").trim().toLowerCase())));
 let added=0;
 START_WORDS.forEach((w,i)=>{const key=w[0].trim().toLowerCase()+"|"+w[1].trim().toLowerCase();if(!known.has(key)){words.push({id:"base_v2_"+i,en:w[0],ru:w[1],example:"",note:"",base:true});known.add(key);added++;}});
 if(added||!localStorage.getItem("et_words"))saveWords();
 try{stats=JSON.parse(localStorage.getItem("et_stats"))||{tests:0,correct:0,best:0,streak:0,history:[]};}catch{stats={tests:0,correct:0,best:0,streak:0,history:[]}}
 try{usedQuestions=JSON.parse(localStorage.getItem("et_used"))||[];}catch{usedQuestions=[]}
}
function saveWords(){localStorage.setItem("et_words",JSON.stringify(words))}
function saveStats(){localStorage.setItem("et_stats",JSON.stringify(stats))}
function saveUsed(){localStorage.setItem("et_used",JSON.stringify(usedQuestions))}
function goHome(){currentQuiz=null;editingId=null;renderHome()}
function shell(title,body){main.innerHTML=`<section class="panel"><div class="topline"><button class="back" onclick="goHome()">← Меню</button><span class="eyebrow">ENGLISH TRAINER</span></div><h2 class="screen-title">${title}</h2>${body}</section>`}
function renderHome(){
 main.innerHTML=`<div class="menu">
 <button class="menu-card" onclick="startQuiz()"><span class="ico mint">▶</span><span class="copy"><strong>Начать тест</strong><small>20 вопросов по твоим словам</small></span><span class="chev mint">›</span></button>
 <button class="menu-card" onclick="renderAdd()"><span class="ico blue">＋</span><span class="copy"><strong>Добавить слово</strong><small>Слово, фраза или предложение — перевод автоматически</small></span><span class="chev blue">›</span></button>
 <button class="menu-card" onclick="renderRating()"><span class="ico gold">🏆</span><span class="copy"><strong>Рейтинг</strong><small>Твои результаты и достижения</small></span><span class="chev gold">›</span></button>
 </div>`;
}
function renderAdd(){
 editingId=null;
 shell("Добавить слово",`<form id="wordForm">
 <label class="field">Тип материала *<select id="kind" required><option value="word">Слово</option><option value="phrase">Фраза</option><option value="sentence">Предложение</option></select></label>
 <label class="field">Английское слово, фраза или предложение *<input id="en" required maxlength="120" placeholder="например, I want to learn"></label>
 <label class="field">Перевод на русский *<input id="ru" maxlength="220" placeholder="Перевод появится автоматически"></label>
 <button class="btn secondary" type="button" id="translateBtn">🌐 Перевести автоматически</button>
 <p class="note" id="translateStatus">Введи английское слово или предложение — перевод можно получить автоматически через интернет.</p>
 <label class="field">Пример на английском (необязательно)<textarea id="example" placeholder="I speak English."></textarea></label>
 <label class="field">Заметка (необязательно)<textarea id="note" placeholder="Подсказка для себя"></textarea></label>
 <button class="btn" type="submit">＋ Сохранить</button></form>
 <p class="note">Выбери тип: слово, фраза или предложение. Материал сразу попадёт в будущие тесты. Его можно изменить или удалить.</p>
 <div class="word-list">${words.slice().reverse().map(w=>`<div class="word-row"><div class="word-info"><strong>${esc(w.en)}</strong><small>${esc(w.ru)}</small></div><button class="mini" onclick="editWord('${w.id}')">Изм.</button><button class="mini delete" onclick="deleteWord('${w.id}')">×</button></div>`).join("")}</div>`);
 const translateBtn=$("#translateBtn"), enInput=$("#en"), ruInput=$("#ru"), status=$("#translateStatus");
 translateBtn.addEventListener("click",()=>translateInto(enInput,ruInput,status,translateBtn));
 enInput.addEventListener("blur",()=>{if(enInput.value.trim()&&!ruInput.value.trim())translateInto(enInput,ruInput,status,translateBtn)});
 $("#wordForm").addEventListener("submit",async e=>{e.preventDefault();let en=enInput.value.trim(),ru=ruInput.value.trim();if(!en)return;if(!ru){await translateInto(enInput,ruInput,status,translateBtn);ru=ruInput.value.trim()}if(!ru){status.textContent="Перевод не получен. Проверь интернет или введи перевод вручную.";return;}const kind=$("#kind").value;
  const item={id:"w"+Date.now(),en,ru,kind,example:$("#example").value.trim(),note:$("#note").value.trim(),base:false};
  // Для одного добавленного слова автоматически создаём фразу для практики.
  if(kind==="word" && !/[.!?]/.test(en) && en.split(/\s+/).length===1 && !item.example){
   item.example=`I want to learn the word "${en}".`;
   item.exampleRu=`Я хочу выучить слово «${ru}».`;
   status.textContent="✓ Слово сохранено. Для теста автоматически создана фраза: "+item.example;
  }
  words.push(item);saveWords();renderAdd();});
}
function editWord(id){
 let w=words.find(x=>x.id===id);if(!w)return;editingId=id;
 shell("Редактировать материал",`<form id="editForm"><label class="field">Тип материала *<select id="kind"><option value="word" ${((w.kind||"word")==="word")?"selected":""}>Слово</option><option value="phrase" ${((w.kind||"word")==="phrase")?"selected":""}>Фраза</option><option value="sentence" ${((w.kind||"word")==="sentence")?"selected":""}>Предложение</option></select></label><label class="field">Английское слово, фраза или предложение *<input id="en" required value="${esc(w.en)}"></label><label class="field">Перевод *<input id="ru" value="${esc(w.ru)}"></label><button class="btn secondary" type="button" id="translateBtn">🌐 Перевести автоматически</button><p class="note" id="translateStatus">Можно автоматически обновить перевод через интернет.</p><label class="field">Пример<textarea id="example">${esc(w.example||"")}</textarea></label><label class="field">Заметка<textarea id="note">${esc(w.note||"")}</textarea></label><button class="btn" type="submit">Сохранить изменения</button></form>`);
 const translateBtn=$("#translateBtn"), enInput=$("#en"), ruInput=$("#ru"), status=$("#translateStatus");
 translateBtn.addEventListener("click",()=>translateInto(enInput,ruInput,status,translateBtn));
 enInput.addEventListener("blur",()=>{if(enInput.value.trim()&&enInput.value.trim()!==w.en)translateInto(enInput,ruInput,status,translateBtn)});
 $("#editForm").addEventListener("submit",e=>{e.preventDefault();w.en=$("#en").value.trim();w.ru=$("#ru").value.trim();w.kind=$("#kind").value;w.example=$("#example").value.trim();w.note=$("#note").value.trim();saveWords();renderAdd()});
}

async function translateInto(enInput,ruInput,status,button){
 const source=enInput.value.trim();
 if(!source){status.textContent="Сначала введи английское слово или предложение.";enInput.focus();return;}
 const oldLabel=button.textContent;button.disabled=true;button.textContent="Перевожу…";status.textContent="Подключаюсь к онлайн-переводчику…";
 try{
  const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(source)+"&langpair=en|ru";
  const response=await fetch(url,{method:"GET"});
  if(!response.ok)throw new Error("network");
  const data=await response.json();
  const translated=String(data?.responseData?.translatedText||"").trim();
  if(!translated||data?.responseStatus&&Number(data.responseStatus)!==200)throw new Error("empty");
  ruInput.value=translated;
  status.textContent="✓ Перевод готов. Проверь его — онлайн-переводчик иногда ошибается.";
 }catch(err){status.textContent="Не удалось получить перевод. Проверь интернет и попробуй ещё раз или введи перевод вручную.";}
 finally{button.disabled=false;button.textContent=oldLabel;}
}
function deleteWord(id){let w=words.find(x=>x.id===id);if(!w)return;if(!confirm(`Удалить слово «${w.en}»?`))return;words=words.filter(x=>x.id!==id);saveWords();renderAdd()}
function renderRating(){
 const hist=stats.history||[];
 shell("Рейтинг",`<div class="stat-grid"><div class="stat"><strong>${stats.best||0}%</strong><span>Лучший результат</span></div><div class="stat"><strong>${stats.tests||0}</strong><span>Пройдено тестов</span></div><div class="stat"><strong>${stats.correct||0}</strong><span>Правильных ответов</span></div><div class="stat"><strong>${stats.streak||0}</strong><span>Текущая серия</span></div></div>
 <h3 style="margin-top:24px">История тестов</h3>${hist.length?hist.slice().reverse().slice(0,10).map(h=>`<div class="history"><span>${esc(h.date)}<br><small class="tiny">${h.correct} из ${h.total} правильно</small></span><strong>${h.percent}%</strong></div>`).join(""):'<div class="empty">Пока нет результатов. Пройди первый тест!</div>'}
 <button class="btn secondary" onclick="if(confirm('Сбросить историю и рейтинг?')){stats={tests:0,correct:0,best:0,streak:0,history:[]};saveStats();renderRating()}">Сбросить рейтинг</button>`);
}
function buildQuestions(){
 let qs=[];
 words.forEach((w)=>{
  // Полные формулировки вопросов, но содержание всегда берётся из слов пользователя.
  const kind=w.kind||((w.en.trim().split(/\s+/).length===1)?"word":(/[.!?]$/.test(w.en.trim())?"sentence":"phrase"));
  const kindRu=kind==="word"?"слово":kind==="sentence"?"предложение":"фразу";
  qs.push({id:w.id+"|enru",prompt:`Что означает ${kindRu} «${w.en}»?`,answer:w.ru,type:"enru",word:w});
  qs.push({id:w.id+"|ruen",prompt:`Как по-английски сказать: «${w.ru}»?`,answer:w.en,type:"ruen",word:w});
  if(w.example&&w.example.trim()){
   const escaped=w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
   const blanked=w.example.replace(new RegExp(escaped,"i"),"_____");
   qs.push({id:w.id+"|sentence",prompt:`Какой английский вариант подходит к переводу «${w.ru}»?\nПример: ${blanked}`,answer:w.en,type:"sentence",word:w});
  }
  // Дополнительный вопрос с фразой помогает запоминать слово в контексте.
  if((w.kind||"word")==="word" && !/[.!?]/.test(w.en.trim()) && w.en.trim().split(/\s+/).length===1){
   const phrase=w.example&&w.example.trim()?w.example:`I want to learn the word "${w.en}".`;
   const phraseRu=w.exampleRu||`Я хочу выучить слово «${w.ru}».`;
   qs.push({id:w.id+"|context",prompt:`Что означает фраза «${phrase}»?`,answer:phraseRu,type:"enru",word:{...w,en:phrase,ru:phraseRu}});
  }
 });
 return qs;
}
function shuffled(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
function startQuiz(){
 if(words.length<4){shell("Мало слов",'<p>Добавь хотя бы 4 слова, чтобы начать тест.</p>');return}
 let all=buildQuestions();let available=all.filter(q=>!usedQuestions.includes(q.id));
 if(available.length<20){if(!confirm("Почти все вопросы уже встречались. Начать новый круг и снова перемешать вопросы?"))return;usedQuestions=[];available=all;}
 let selected=shuffled(available).slice(0,Math.min(20,available.length));
 currentQuiz={questions:selected,index:0,correct:0,answered:false,answers:[]};renderQuestion();
}
function makeOptions(q){
 let pool;
 if(q.type==="enru")pool=words.map(w=>w.ru).filter(x=>x!==q.answer);
 else pool=words.map(w=>w.en).filter(x=>x!==q.answer);
 pool=[...new Set(pool)];return shuffled([q.answer,...shuffled(pool).slice(0,3)]);
}
function renderQuestion(){
 let q=currentQuiz.questions[currentQuiz.index];if(!q){finishQuiz();return}
 currentQuiz.answered=false;
 let opts=makeOptions(q);currentQuiz.currentOptions=opts;
 let label=q.type==="enru"?"Выбери правильный перевод":q.type==="ruen"?"Выбери правильную английскую фразу":"Выбери подходящий вариант";
 let prompt=q.prompt.replace(/\n/g,"<br>");
 shell("Тест",`<div class="question-meta">Вопрос ${currentQuiz.index+1} из ${currentQuiz.questions.length} · Правильно: ${currentQuiz.correct}</div><div class="eyebrow">${label}</div><div class="question">${esc(q.prompt).replace(/\n/g,"<br>")}</div><div class="answers">${opts.map((o,i)=>`<button class="answer" data-index="${i}" onclick="chooseAnswer(${i})">${esc(o)}</button>`).join("")}</div><div id="feedback"></div><button id="next" class="btn hidden" onclick="nextQuestion()">${currentQuiz.index===currentQuiz.questions.length-1?"Завершить тест":"Далее →"}</button>`);
}
function chooseAnswer(i){
 if(!currentQuiz||currentQuiz.answered)return;currentQuiz.answered=true;
 let q=currentQuiz.questions[currentQuiz.index],selected=currentQuiz.currentOptions[i],ok=selected===q.answer;
 if(ok)currentQuiz.correct++;
 currentQuiz.answers.push({q,selected,ok});usedQuestions.push(q.id);saveUsed();
 document.querySelectorAll(".answer").forEach((b,j)=>{b.disabled=true;if(currentQuiz.currentOptions[j]===q.answer)b.classList.add("correct");if(j===i&&!ok)b.classList.add("wrong")});
 $("#feedback").innerHTML=ok?`<div class="feedback ok">✓ Правильно!<br>${esc(q.word.en)} — ${esc(q.word.ru)}</div>`:`<div class="feedback no">✕ Неправильно.<br>Правильный ответ: <strong>${esc(q.answer)}</strong><br>${esc(q.word.en)} — ${esc(q.word.ru)}</div>`;
 $("#next").classList.remove("hidden");
}
function nextQuestion(){if(!currentQuiz.answered)return;currentQuiz.index++;renderQuestion()}
function finishQuiz(){
 let total=currentQuiz.questions.length,correct=currentQuiz.correct,percent=Math.round(correct/total*100);
 stats.tests++;stats.correct+=correct;stats.best=Math.max(stats.best||0,percent);stats.streak=percent===100?(stats.streak||0)+1:0;
 stats.history=stats.history||[];stats.history.push({date:new Date().toLocaleDateString("ru-RU"),correct,total,percent});stats.history=stats.history.slice(-50);saveStats();
 let misses=currentQuiz.answers.filter(a=>!a.ok);
 shell("Тест завершён",`<div style="text-align:center;padding:10px 0 20px"><div style="font-size:52px">${percent>=80?"🏆":percent>=50?"💪":"📚"}</div><div style="font-size:42px;font-weight:900;color:var(--mint)">${correct}/${total}</div><div style="color:var(--muted);font-size:17px">${percent}% правильных ответов</div></div><h3>Ошибки</h3>${misses.length?misses.map(a=>`<div class="history"><span><strong>${esc(a.q.prompt)}</strong><br><small class="tiny">Твой ответ: ${esc(a.selected)}</small><br><small class="tiny">Правильно: ${esc(a.q.answer)}</small></span></div>`).join(""):'<div class="empty">Отлично! Ошибок нет 🎉</div>'}<button class="btn" onclick="startQuiz()">Пройти ещё раз</button><button class="btn secondary" onclick="renderRating()">Открыть рейтинг</button>`);
}
load();renderHome();
</script>
